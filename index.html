<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CALCX Scientific Calculator</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
}

html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
}

body {
    background: #0d0f1f;
    color: #ffffff;
    font-family: Roboto, Arial, sans-serif;
}

.app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    background: #111522;
    padding: 14px 14px 10px;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
}

.header {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
    margin-bottom: 6px;
}

.brand {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 3px;
}

.brand span { color: #9870ff; }

.subtitle {
    color: #8c94aa;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 4px;
}

.tools {
    display: -webkit-flex;
    display: flex;
}

.icon-btn {
    background: #1b2030;
    border: 1px solid #30364b;
    color: #ffffff;
    width: 44px;
    height: 44px;
    border-radius: 14px;
    font-size: 19px;
    margin-left: 8px;
}

.icon-btn.fx {
    font-size: 16px;
    font-style: italic;
    font-weight: bold;
    color: #b7a2ff;
}

.icon-btn.cur-btn {
    font-size: 20px;
    font-weight: bold;
    color: #b7a2ff;
}

.history-panel {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
    display: none;
    margin-bottom: 8px;
    border: 1px solid #30364b;
    border-radius: 16px;
    padding: 12px;
    max-height: 30%;
    overflow-y: auto;
}

.history-panel.show { display: block; }

.history-title {
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    color: #8c94aa;
    font-size: 12px;
    margin-bottom: 8px;
}

.history-item {
    padding: 9px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    font-size: 13px;
    word-break: break-all;
}

.history-result { color: #9870ff; margin-top: 3px; font-size: 15px; }

.history-clear {
    border: none;
    background: transparent;
    color: #c8b6ff;
    font-size: 12px;
}

.display {
    -webkit-flex: 1 1 auto;
    flex: 1 1 auto;
    min-height: 80px;
    display: -webkit-flex;
    display: flex;
    -webkit-flex-direction: column;
    flex-direction: column;
    -webkit-justify-content: flex-end;
    justify-content: flex-end;
    -webkit-align-items: flex-end;
	align-items: flex-end;
    padding: 4px 4px 10px;
    overflow: hidden;
}

.previous {
    min-height: 24px;
    color: #8c94aa;
    font-size: 17px;
    word-break: break-all;
    text-align: right;
}

.previous.error { color: #ff7a8a; }

.current {
    width: 100%;
    text-align: right;
    font-size: 48px;
    font-weight: 300;
    line-height: 1.15;
    word-break: break-all;
}

.current .dim { color: #5b627a; }

.cursor {
    display: inline-block;
    width: 0;
    height: 0.95em;
    border-left: 2px solid #9870ff;
    vertical-align: text-bottom;
    -webkit-animation: blink 1s steps(1) infinite;
    animation: blink 1s steps(1) infinite;
}

@-webkit-keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

@keyframes blink {
    0% { opacity: 1; }
    50% { opacity: 0; }
    100% { opacity: 1; }
}

sup {
    font-size: 0.6em;
    vertical-align: super;
    line-height: 0;
}

/* Scientific panel */
.sci {
    -webkit-flex: 0 0 22%;
    flex: 0 0 22%;
    min-height: 0;
    display: none;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    grid-gap: 8px;
    gap: 8px;
    margin-bottom: 10px;
}

.app.sci-on .sci { display: grid; }

.sci button.key {
    font-size: 17px;
    border-radius: 14px;
    background: #1d2136;
    color: #cfc2ff;
}

.sci button.key:active { background: #343b53; }
.sci button.key.on { background: #7a52f0; color: #ffffff; }

/* Main keypad */
.keypad {
    -webkit-flex: 0 0 62%;
    flex: 0 0 62%;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(6, 1fr);
    grid-gap: 10px;
    gap: 10px;
}

.app.sci-on .keypad {
    -webkit-flex-basis: 47%;
    flex-basis: 47%;
}

button.key {
    width: 100%;
    height: 100%;
    min-height: 0;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    background: #1b2030;
    color: #ffffff;
    font-size: 24px;
    font-weight: 500;
    outline: none;
}

button.key:active { background: #343b53; }
button.function { color: #b7a2ff; background: #25213b; }
button.function:active { background: #3a3260; }
button.operator { color: #c8b6ff; background: #2d2650; font-size: 28px; }
button.operator:active { background: #433a73; }
button.equals { background: #7a52f0; color: #ffffff; }
button.equals:active { background: #9370ff; }
button.zero { grid-column: span 2; }

.footer {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
    text-align: center;
    margin-top: 8px;
    font-size: 10px;
    color: #687087;
    letter-spacing: 3px;
}

/* Currency converter */
.cur-screen, .cur-picker {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #111522;
    padding: 14px 14px 10px;
    display: none;
    -webkit-flex-direction: column;
    flex-direction: column;
    z-index: 20;
}

.cur-picker { z-index: 30; }

.cur-screen.show, .cur-picker.show {
    display: -webkit-flex;
    display: flex;
}

.cur-head {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
    display: -webkit-flex;
    display: flex;
    -webkit-justify-content: space-between;
    justify-content: space-between;
    -webkit-align-items: center;
    align-items: center;
    margin-bottom: 10px;
}

.cur-title {
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
}

.cur-rows {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
}

.cur-row {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: stretch;
    align-items: stretch;
    background: #1b2030;
    border: 1px solid #30364b;
    border-radius: 18px;
    margin-bottom: 8px;
    min-height: 84px;
    overflow: hidden;
}

.cur-row.active { border-color: #9870ff; }

.cur-pick {
    -webkit-flex: 0 0 40%;
    flex: 0 0 40%;
    min-width: 0;
    background: transparent;
    border: none;
    border-right: 1px solid #30364b;
    color: #ffffff;
    padding: 8px 10px;
    text-align: left;
    font-family: inherit;
    outline: none;
	}

.cur-code {
    display: block;
    font-size: 22px;
    font-weight: bold;
    color: #c8b6ff;
}

.cur-name {
    display: block;
    font-size: 11px;
    color: #8c94aa;
    margin-top: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.cur-amt {
    -webkit-flex: 1;
    flex: 1;
    min-width: 0;
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    -webkit-justify-content: flex-end;
    justify-content: flex-end;
    padding: 0 14px;
    font-size: 36px;
    font-weight: 300;
    text-align: right;
    word-break: break-all;
    overflow: hidden;
}

.cur-info {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
    font-size: 14px;
    color: #cfc2ff;
    text-align: center;
    margin: 4px 0 2px;
    min-height: 20px;
}

.cur-status {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
    font-size: 11px;
    color: #8c94aa;
    text-align: center;
    min-height: 16px;
    margin-bottom: 8px;
}

.cur-pad {
    -webkit-flex: 1 1 auto;
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    grid-gap: 10px;
    gap: 10px;
}

.cur-credit {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
    font-size: 9px;
    color: #687087;
    text-align: center;
    margin-top: 8px;
    letter-spacing: 1px;
}

.cur-picker input {
    -webkit-flex: 0 0 auto;
    flex: 0 0 auto;
    width: 100%;
    height: 46px;
    border-radius: 14px;
    border: 1px solid #30364b;
    background: #1b2030;
    color: #ffffff;
    padding: 0 14px;
    font-size: 16px;
    outline: none;
    margin-bottom: 8px;
    -webkit-user-select: text;
    user-select: text;
}

.cur-list {
    -webkit-flex: 1 1 auto;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
}

.cur-item {
    display: -webkit-flex;
    display: flex;
    -webkit-align-items: center;
    align-items: center;
    padding: 12px 8px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}

.cur-item .c {
    -webkit-flex: 0 0 56px;
    flex: 0 0 56px;
    font-weight: bold;
    color: #c8b6ff;
    font-size: 16px;
}

.cur-item .n {
    -webkit-flex: 1;
    flex: 1;
    font-size: 14px;
    color: #dfe3f0;
}

.cur-item.sel { background: rgba(122, 82, 240, 0.18); }

@media (max-height: 640px) {
    .current { font-size: 38px; }
    button.key { font-size: 20px; border-radius: 16px; }
    .sci button.key { font-size: 14px; }
    .subtitle, .footer { display: none; }
    .sci { -webkit-flex-basis: 24%; flex-basis: 24%; }
    .app.sci-on .keypad { -webkit-flex-basis: 44%; flex-basis: 44%; }
    .cur-row { min-height: 64px; }
    .cur-amt { font-size: 28px; }
    .cur-credit { display: none; }
}

/* Loading screen */
#loader {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 9999;
    background: #0d0f1f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: loaderHide 0.5s ease 2.6s forwards;
}

@keyframes loaderHide {
    to { opacity: 0; visibility: hidden; }
}

#loader::before {
    content: "";
    position: absolute;
    width: 320px;
    height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(152, 112, 255, 0.35), transparent 70%);
    animation: ldGlow 2.4s ease-in-out infinite;
}

@keyframes ldGlow {
    0%, 100% { transform: scale(0.85); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
}

.ld-float span {
    position: absolute;
    bottom: -40px;
    font-size: 28px;
    font-weight: bold;
    color: rgba(184, 162, 255, 0.25);
    animation: ldRise 8s linear infinite;
}

.ld-float span:nth-child(1) { left: 8%; }
.ld-float span:nth-child(2) { left: 24%; animation-delay: 1.5s; font-size: 34px; }
.ld-float span:nth-child(3) { left: 40%; animation-delay: 0.6s; }
.ld-float span:nth-child(4) { left: 56%; animation-delay: 2.2s; font-size: 22px; }
.ld-float span:nth-child(5) { left: 70%; animation-delay: 1s; font-size: 36px; }
.ld-float span:nth-child(6) { left: 85%; animation-delay: 2.8s; }

@keyframes ldRise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(180deg); opacity: 0; }
}

.ld-logo {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 26px;
    animation: ldPop 0.8s ease both;
}

@keyframes ldPop {
    from { transform: scale(0.4); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.ld-ring {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #9870ff;
    border-right-color: #4f8bff;
    animation: ldSpin 1.2s linear infinite;
}

@keyframes ldSpin {
    to { transform: rotate(360deg); }
}

.ld-x {
    width: 74px;
    height: 74px;
    border-radius: 22px;
    background: linear-gradient(135deg, #9870ff, #4f8bff);
    color: #ffffff;
    font-size: 38px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(152, 112, 255, 0.6);
    animation: ldBeat 1.5s ease-in-out infinite;
}

@keyframes ldBeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
	}

	.ld-name {
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 8px;
    margin-left: 8px;
    animation: ldUp 0.7s ease 0.3s both;
}

.ld-name span { color: #9870ff; }

.ld-sub {
    color: #8c94aa;
    font-size: 11px;
    letter-spacing: 4px;
    margin-top: 8px;
    animation: ldUp 0.7s ease 0.5s both;
}

.ld-bar {
    width: 180px;
    height: 5px;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.1);
    margin-top: 36px;
    overflow: hidden;
    animation: ldUp 0.7s ease 0.7s both;
}

.ld-fill {
    width: 0;
    height: 100%;
    border-radius: 5px;
    background: linear-gradient(90deg, #9870ff, #4f8bff);
    animation: ldFill 2.3s ease-in-out 0.3s forwards;
}

@keyframes ldFill {
    to { width: 100%; }
}

.ld-pct {
    color: #b7a2ff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-top: 12px;
    animation: ldUp 0.7s ease 0.7s both;
}

@keyframes ldUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<div id="loader">
    <div class="ld-float">
        <span>+</span>
        <span>&divide;</span>
        <span>=</span>
        <span>&times;</span>
        <span>&pi;</span>
        <span>&radic;</span>
    </div>

    <div class="ld-logo">
        <div class="ld-ring"></div>
        <div class="ld-x">X</div>
    </div>

    <div class="ld-name">CALC<span>X</span></div>
    <div class="ld-sub">SCIENTIFIC CALCULATOR</div>

    <div class="ld-bar"><div class="ld-fill"></div></div>
    <div class="ld-pct" id="ldPct">0%</div>
</div>

<script>
var ldPct = document.getElementById("ldPct");
var ldNum = 0;

var ldTimer = setInterval(function () {
    ldNum += 2;
    if (ldNum > 100) ldNum = 100;
    ldPct.textContent = ldNum + "%";
    if (ldNum == 100) clearInterval(ldTimer);
}, 46);

setTimeout(function () {
    var box = document.getElementById("loader");
    if (box) box.parentNode.removeChild(box);
}, 3200);
</script>


<div class="app" id="app">

    <div class="header">
        <div>
            <div class="brand">CALC<span>X</span></div>
            <div class="subtitle">SCIENTIFIC CALCULATOR</div>

        <div class="tools">

    <!-- Currency picker -->

</div>
<script>
window.onerror = function (msg, src, line) {
    var p = document.getElementById("previous");
    if (p) p.textContent = "Error: " + msg + " (line " + line + ")";
};

var appEl = document.getElementById("app");
var currentEl = document.getElementById("current");
var previousEl = document.getElementById("previous");
var historyPanel = document.getElementById("historyPanel");
var historyList = document.getElementById("historyList");

var toks = [];
var pos = 0;
var justEvaluated = false;
var errorFlag = false;
var lastExprText = "";
var calcHistory = [];
var angleMode = "DEG";
var invOn = false;

var PI_T = "\u03c0";

var shown = {
    "*": "\u00d7",
    "/": "\u00f7",
    "-": "\u2212",
    "exp(": "e^(",
    "tenx(": "10^(",
    "sqrt(": "\u221a(",
    "cbrt(": "\u00b3\u221a("
};

var fnTokens = {
    sin: ["sin(", "asin("],
    cos: ["cos(", "acos("],
    tan: ["tan(", "atan("],
    ln: ["ln(", "exp("],
    log: ["log(", "tenx("],
    sqrt: ["sqrt(", "cbrt("],
    abs: ["abs(", "abs("]
};

var fnLabels = {
    sin: ["sin", "sin<sup>-1</sup>"],
    cos: ["cos", "cos<sup>-1</sup>"],
    tan: ["tan", "tan<sup>-1</sup>"],
    ln: ["ln", "e<sup>x</sup>"],
    log: ["log", "10<sup>x</sup>"],
    sqrt: ["&radic;", "<sup>3</sup>&radic;"]
};

function showTok(t) {
    return shown.hasOwnProperty(t) ? shown[t] : t;
}

function displayToks(arr) {
    var out = "";
    for (var i = 0; i < arr.length; i++) out += showTok(arr[i]);
    return out;
}

/* ---------- Token helpers ---------- */
function isNumPart(t) { return t.length === 1 && "0123456789.".indexOf(t) !== -1; }
function isDigitT(t) { return t.length === 1 && "0123456789".indexOf(t) !== -1; }
function isFnT(t) { return t.length > 1 && t.charAt(t.length - 1) === "("; }
function isOpenT(t) { return t === "(" || isFnT(t); }
function isLiteralT(t) { return t.length > 1 && "0123456789".indexOf(t.charAt(0)) !== -1; }
function isBinT(t) { return t === "+" || t === "-" || t === "*" || t === "/" || t === "^"; }
function isValueEndT(t) {
    return isNumPart(t) || t === ")" || t === "%" || t === "!" || t === PI_T || t === "e" || isLiteralT(t);
}

function prevT() { return pos > 0 ? toks[pos - 1] : ""; }
function nextT() { return pos < toks.length ? toks[pos] : ""; }

function insertTok(arr) {
    for (var i = 0; i < arr.length; i++) {
        toks.splice(pos, 0, arr[i]);
        pos++;
    }
}

function numberBounds() {
    var s = pos;
    var e = pos;
    while (s > 0 && isNumPart(toks[s - 1])) s--;
    while (e < toks.length && isNumPart(toks[e])) e++;
    return [s, e];
}

function resultToks(s) {
    var neg = s.charAt(0) === "-";
    var body = neg ? s.slice(1) : s;
    var out = neg ? ["-"] : [];
    if (body.indexOf("e") !== -1) {
        out.push(body);
    } else {
        for (var i = 0; i < body.length; i++) out.push(body.charAt(i));
    }
    return out;
}

function isPureNumber() {
    if (toks.length === 0) return false;
    for (var i = 0; i < toks.length; i++) {
        if (!isNumPart(toks[i])) return toks.length === 1 && isLiteralT(toks[0]);
    }
    return true;
}

function startFresh() {
    if (justEvaluated) {
        toks = [];
        pos = 0;
        justEvaluated = false;
    }
}

function continueResult() {
    if (justEvaluated) {
        justEvaluated = false;
        pos = toks.length;
    }
}

function formatNumber(n) {
    if (!isFinite(n) || isNaN(n)) return "Error";
    if (n === 0) return "0";
    return String(parseFloat(n.toPrecision(12)));
}

/* ---------- Hisab ka engine ---------- */
function toNumber(s) {
    if (!/^(\d+\.?\d*|\.\d+)$/.test(s)) throw new Error("num");
    return parseFloat(s);
}

function chk(v) {
    if (!isFinite(v) || isNaN(v)) throw new Error("math");
    return v;
}

function cleanTiny(v) {
    return Math.abs(v) < 1e-12 ? 0 : v;
}

function factorial(x) {
    if (x < 0 || x !== Math.floor(x) || x > 170) throw new Error("fact");
    var r = 1;
    for (var i = 2; i <= x; i++) r *= i;
    return r;
}

function applyFn(name, x) {
    var deg = angleMode === "DEG";
    var toRad = deg ? Math.PI / 180 : 1;
    var r;

    switch (name) {
        case "sin(":
            return cleanTiny(Math.sin(x * toRad));
        case "cos(":
            return cleanTiny(Math.cos(x * toRad));
        case "tan(":
            if (deg && Math.abs(x % 180) === 90) throw new Error("tan");
            return cleanTiny(Math.tan(x * toRad));
        case "asin(":
            if (x < -1 || x > 1) throw new Error("dom");
            r = Math.asin(x);
			return deg ? r * 180 / Math.PI : r;
        case "acos(":
            if (x < -1 || x > 1) throw new Error("dom");
            r = Math.acos(x);
            return deg ? r * 180 / Math.PI : r;
        case "atan(":
            r = Math.atan(x);
            return deg ? r * 180 / Math.PI : r;
        case "ln(":
            if (x <= 0) throw new Error("dom");
            return Math.log(x);
        case "log(":
            if (x <= 0) throw new Error("dom");
            return Math.log(x) / Math.LN10;
        case "sqrt(":
            if (x < 0) throw new Error("dom");
            return Math.sqrt(x);
        case "cbrt(":
            return x < 0 ? -Math.pow(-x, 1 / 3) : Math.pow(x, 1 / 3);
        case "exp(":
            return Math.exp(x);
        case "tenx(":
            return Math.pow(10, x);
        case "abs(":
            return Math.abs(x);
    }
    throw new Error("fn");
}

function evaluate(arr) {
    var tokens = [];
    var num = "";
    var i, t;

    for (i = 0; i < arr.length; i++) {
        t = arr[i];
        if (isNumPart(t)) { num += t; continue; }
        if (num !== "") { tokens.push(toNumber(num)); num = ""; }
        if (isLiteralT(t)) tokens.push(parseFloat(t));
        else tokens.push(t);
    }
    if (num !== "") tokens.push(toNumber(num));

    var p = 0;

    function peek() { return p < tokens.length ? tokens[p] : null; }

    function isFnTok(x) { return typeof x === "string" && isFnT(x); }

    function isValueStart(x) {
        return typeof x === "number" || x === "(" || x === PI_T || x === "e" || isFnTok(x);
    }

    function closeParen() {
        if (peek() === ")") p++;
        else if (p >= tokens.length) { /* band na ho to khud band maan lo */ }
        else throw new Error("paren");
    }

    function parseExpr() {
        var left = parseTerm();
        while (peek() === "+" || peek() === "-") {
            var op = tokens[p++];
            var right = parseTerm();
            var rv = right.pct ? left.v * right.v : right.v;
            left = { v: chk(op === "+" ? left.v + rv : left.v - rv), pct: false };
        }
        return left;
    }

    function parseTerm() {
        var left = parseUnary();
        while (peek() === "*" || peek() === "/" || isValueStart(peek())) {
            var op = "*";
            if (peek() === "*" || peek() === "/") op = tokens[p++];
            var right = parseUnary();
            if (op === "/" && right.v === 0) throw new Error("div0");
            left = { v: chk(op === "*" ? left.v * right.v : left.v / right.v), pct: false };
        }
        return left;
    }

    function parseUnary() {
        if (peek() === "-") {
            p++;
            var x = parseUnary();
            return { v: -x.v, pct: x.pct };
        }
		if (peek() === "+") {
            p++;
            return parseUnary();
        }
        return parsePower();
    }

    function parsePower() {
        var base = parsePostfix();
        if (peek() === "^") {
            p++;
            var ex = parseUnary();
            return { v: chk(Math.pow(base.v, ex.v)), pct: false };
        }
        return base;
    }

    function parsePostfix() {
        var node = parsePrimary();
        while (peek() === "%" || peek() === "!") {
            var s = tokens[p++];
            if (s === "%") node = { v: node.v / 100, pct: true };
            else node = { v: chk(factorial(node.v)), pct: false };
        }
        return node;
    }

    function parsePrimary() {
        var t = peek();
        if (typeof t === "number") { p++; return { v: t, pct: false }; }
        if (t === PI_T) { p++; return { v: Math.PI, pct: false }; }
        if (t === "e") { p++; return { v: Math.E, pct: false }; }
        if (t === "(") {
            p++;
            var inner = parseExpr();
            closeParen();
            return { v: inner.v, pct: false };
        }
        if (isFnTok(t)) {
            p++;
            var arg = parseExpr();
            closeParen();
            return { v: chk(applyFn(t, arg.v)), pct: false };
        }
        throw new Error("syntax");
    }

    var res = parseExpr();
    if (p !== tokens.length) throw new Error("syntax");
    return res.v;
}

function previewText() {
    if (toks.length === 0) return "";
    if (isPureNumber()) return "";
    try {
        var s = formatNumber(evaluate(toks));
        if (s === "Error") return "";
        return "= " + s;
    } catch (e) {
        return "";
    }
}

/* ---------- Screen par dikhana ---------- */
function render() {
    currentEl.innerHTML = "";

    if (toks.length === 0) {
        var ph = document.createElement("span");
        ph.className = "dim";
        ph.textContent = "0";
        currentEl.appendChild(ph);
    } else {
        for (var i = 0; i < toks.length; i++) {
            if (i === pos) {
                var cur = document.createElement("span");
                cur.className = "cursor";
                currentEl.appendChild(cur);
            }
            var ch = document.createElement("span");
            ch.className = "ch";
            ch.setAttribute("data-i", String(i));
            ch.textContent = showTok(toks[i]);
            currentEl.appendChild(ch);
        }
        if (pos >= toks.length) {
            var cur2 = document.createElement("span");
            cur2.className = "cursor";
            currentEl.appendChild(cur2);
        }
    }

    if (errorFlag) {
        previousEl.textContent = "Error";
        previousEl.className = "previous error";
    } else {
        previousEl.className = "previous";
        previousEl.textContent = justEvaluated ? lastExprText : previewText();
    }

    var len = displayToks(toks).length;
    var size = 48;
    if (len > 24) size = 20;
    else if (len > 17) size = 26;
    else if (len > 12) size = 33;
    else if (len > 8) size = 40;
    currentEl.style.fontSize = size + "px";
}

/* ---------- Buttons ke kaam ---------- */
function resetAll() {
    toks = [];
    pos = 0;
    justEvaluated = false;
    errorFlag = false;
    lastExprText = "";
    render();
}

function addNumber(d) {
    errorFlag = false;
    startFresh();

    var b = numberBounds();
    var tok = toks.slice(b[0], b[1]).join("");

    if (tok === "0" && pos === b[1]) {
        toks[b[0]] = d;
        pos = b[0] + 1;
    } else {
        if (tok.replace(".", "").length >= 15) { render(); return; }
        insertTok([d]);
    }
    render();
}

function addDecimal() {
    errorFlag = false;
    startFresh();

    var b = numberBounds();
    var tok = toks.slice(b[0], b[1]).join("");

    if (tok.indexOf(".") === -1) {
        if (tok === "") insertTok(["0", "."]);
        else insertTok(["."]);
    }
    render();
}

function addOperator(op) {
    errorFlag = false;
    continueResult();

    var pc = prevT();

    if (op === "-" && (pc === "*" || pc === "/" || pc === "^")) {
        insertTok(["-"]);
    } else {
        while (isBinT(prevT())) {
            toks.splice(pos - 1, 1);
            pos--;
        }
        pc = prevT();

        if (pc === "" || isOpenT(pc)) {
            if (op === "-") insertTok(["-"]);
        } else if (isBinT(nextT())) {
            toks[pos] = op;
            pos++;
        } else {
            insertTok([op]);
        }
    }
    render();
}

function addPostfix(sym) {
    errorFlag = false;
    continueResult();
    if (isValueEndT(prevT())) insertTok([sym]);
    render();
}

function addPower(arr) {
    errorFlag = false;
    continueResult();
    if (isValueEndT(prevT())) insertTok(arr);
    render();
}

function addConst(c) {
    errorFlag = false;
    startFresh();
    insertTok([c]);
    render();
	}
	function addFunction(name) {
    errorFlag = false;
    startFresh();
    insertTok([fnTokens[name][invOn ? 1 : 0]]);
    if (invOn) {
        invOn = false;
        updateSciLabels();
    }
    render();
}

function addParen(which) {
    errorFlag = false;

    if (which === "(") {
        startFresh();
        insertTok(["("]);
    } else {
        continueResult();
        var open = 0;
        for (var i = 0; i < pos; i++) {
            if (isOpenT(toks[i])) open++;
            else if (toks[i] === ")") open--;
        }
        if (open > 0 && isValueEndT(prevT())) insertTok([")"]);
    }
    render();
}

function doBackspace() {
    errorFlag = false;
    continueResult();
    if (pos > 0) {
        toks.splice(pos - 1, 1);
        pos--;
    }
    render();
}

function moveLeft() {
    errorFlag = false;
    continueResult();
    if (pos > 0) pos--;
    render();
}

function moveRight() {
    errorFlag = false;
    continueResult();
    if (pos < toks.length) pos++;
    render();
}

function doEquals() {
    errorFlag = false;
    if (justEvaluated || toks.length === 0 || isPureNumber()) {
        render();
        return;
    }

    try {
        var s = formatNumber(evaluate(toks));
        if (s === "Error") throw new Error("bad");

        lastExprText = displayToks(toks) + " =";
        calcHistory.unshift({ expression: lastExprText, result: s });
        calcHistory = calcHistory.slice(0, 30);
        renderHistory();

        toks = resultToks(s);
        pos = toks.length;
        justEvaluated = true;
    } catch (e) {
        errorFlag = true;
    }
    render();
}
/* ---------- Scientific buttons ---------- */
function updateSciLabels() {
    var list = document.querySelectorAll("#sci button");
    for (var k = 0; k < list.length; k++) {
        var f = list[k].getAttribute("data-fn");
        if (f !== null && fnLabels.hasOwnProperty(f)) {
            list[k].innerHTML = fnLabels[f][invOn ? 1 : 0];
        }
        if (list[k].getAttribute("data-act") === "inv") {
            list[k].className = invOn ? "key on" : "key";
        }
    }
}

/* ---------- History ---------- */
function renderHistory() {
    historyList.innerHTML = "";

    if (calcHistory.length === 0) {
        var empty = document.createElement("div");
        empty.className = "history-item";
        empty.textContent = "No calculations yet";
        historyList.appendChild(empty);
        return;
    }

    for (var i = 0; i < calcHistory.length; i++) {
        (function (item) {
            var row = document.createElement("div");
            row.className = "history-item";

            var ex = document.createElement("div");
            ex.textContent = item.expression;

            var res = document.createElement("div");
            res.className = "history-result";
            res.textContent = item.result;

            row.appendChild(ex);
            row.appendChild(res);

            row.onclick = function () {
                toks = resultToks(item.result);
                pos = toks.length;
                justEvaluated = false;
                errorFlag = false;
                render();
                historyPanel.classList.remove("show");
            };

            historyList.appendChild(row);
        })(calcHistory[i]);
    }
}

/* ---------- Events ---------- */
var buttons = document.querySelectorAll("#keypad button");

for (var b = 0; b < buttons.length; b++) {
    buttons[b].onclick = function () {
        var num = this.getAttribute("data-num");
        var op = this.getAttribute("data-op");
        var action = this.getAttribute("data-action");

        if (num !== null) addNumber(num);
        else if (op !== null) addOperator(op);
        else if (action === "clear") resetAll();
        else if (action === "backspace") doBackspace();
        else if (action === "left") moveLeft();
        else if (action === "right") moveRight();
        else if (action === "percent") addPostfix("%");
        else if (action === "lparen") addParen("(");
        else if (action === "rparen") addParen(")");
        else if (action === "decimal") addDecimal();
        else if (action === "equals") doEquals();
    };
}

var sciButtons = document.querySelectorAll("#sci button");

for (var k = 0; k < sciButtons.length; k++) {
    sciButtons[k].onclick = function () {
        var fn = this.getAttribute("data-fn");
        var act = this.getAttribute("data-act");

        if (fn !== null) addFunction(fn);
        else if (act === "inv") { invOn = !invOn; updateSciLabels(); }
        else if (act === "deg") {
            angleMode = angleMode === "DEG" ? "RAD" : "DEG";
            this.textContent = angleMode;
            render();
        }
        else if (act === "sq") addPower(["^", "2"]);
        else if (act === "pow") addPower(["^"]);
        else if (act === "pi") addConst(PI_T);
        else if (act === "e") addConst("e");
        else if (act === "fact") addPostfix("!");
        else if (act === "recip") addPower(["^", "(", "-", "1", ")"]);
    };
}

/* Display par tap karke cursor rakhna */
currentEl.onclick = function (e) {
    if (toks.length === 0) return;

    justEvaluated = false;
    errorFlag = false;

    var t = e.target;
    var idx = t && t.getAttribute ? t.getAttribute("data-i") : null;

    if (idx !== null) {
        var rect = t.getBoundingClientRect();
        var i = parseInt(idx, 10);
        pos = (e.clientX < rect.left + rect.width / 2) ? i : i + 1;
    } else {
        var first = currentEl.querySelector(".ch");
        if (first && e.clientX < first.getBoundingClientRect().left) pos = 0;
        else pos = toks.length;
    }
    render();
};
	document.getElementById("sciToggle").onclick = function () {
    appEl.classList.toggle("sci-on");
};

document.getElementById("historyToggle").onclick = function () {
    historyPanel.classList.toggle("show");
    renderHistory();
};

document.getElementById("clearHistory").onclick = function () {
    calcHistory = [];
    renderHistory();
};

    "TRY", "BDT", "AFN", "QAR", "KWD", "OMR", "BHD", "MYR", "SGD", "THB", "KRW", "RUB", "EGP", "ZAR",
    "NGN", "BRL", "MXN", "IDR"];

var CX_URLS = [
    "https://open.er-api.com/v6/latest/USD",
    "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.min.json",
    "https://latest.currency-api.pages.dev/v1/currencies/usd.min.json"
];

var CX_KEY = "calcx_rates_v1";
var CX_PAIR = "calcx_pair_v1";

var cxRates = null;
var cxStamp = 0;
var cxNext = 0;
var cxLoading = false;
var cxLastTry = 0;
var cxFailed = false;
var cxPickerSide = "from";
var cxState = { from: "USD", to: "EUR", amount: "1", active: "from", fresh: true };

var cxScreen = document.getElementById("curScreen");
var cxPicker = document.getElementById("curPicker");
var cxSearch = document.getElementById("curSearch");
var cxList = document.getElementById("curList");

/* ----- Saved data ----- */
function cxLoad() {
    try {
        var raw = window.localStorage.getItem(CX_KEY);
        if (raw) {
            var d = JSON.parse(raw);
            if (d && d.rates) {
                cxRates = d.rates;
                cxStamp = d.ts || 0;
                cxNext = d.next || 0;
            }
        }
        var pr = window.localStorage.getItem(CX_PAIR);
        if (pr) {
            var p = JSON.parse(pr);
            if (p && p.from) cxState.from = p.from;
            if (p && p.to) cxState.to = p.to;
        }
    } catch (e) { }
}

function cxSave() {
    try {
        window.localStorage.setItem(CX_KEY, JSON.stringify({ rates: cxRates, ts: cxStamp, next: cxNext }));
    } catch (e) { }
}

function cxSavePair() {
    try {
        window.localStorage.setItem(CX_PAIR, JSON.stringify({ from: cxState.from, to: cxState.to }));
    } catch (e) { }
}

/* ----- Internet se rates lena ----- */
function cxGet(url, ok, fail) {
    var xhr = new XMLHttpRequest();
    var done = false;

    xhr.open("GET", url, true);
    xhr.timeout = 15000;

    xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4 || done) return;
        done = true;
        if (xhr.status === 200) {
            try { ok(JSON.parse(xhr.responseText)); }
            catch (e) { fail(); }
        } else {
            fail();
        }
    };

    try { xhr.send(); } catch (e) { if (!done) { done = true; fail(); } }
}

function cxParse(data) {
    var out = {};
    var count = 0;
    var code, src;

    if (data && data.result === "success" && data.rates) {
        src = data.rates;
        for (code in src) {
            if (src.hasOwnProperty(code) && typeof src[code] === "number" && src[code] > 0) {
                out[code] = src[code];
                count++;
            }
        }
        if (count < 20) return null;
        return { rates: out, next: data.time_next_update_unix ? data.time_next_update_unix * 1000 : 0 };
    }

    if (data && data.usd) {
        src = data.usd;
        for (code in src) {
            if (src.hasOwnProperty(code)) {
                var up = code.toUpperCase();
                if (CUR_NAMES.hasOwnProperty(up) && typeof src[code] === "number" && src[code] > 0) {
                    out[up] = src[code];
                    count++;
                }
            }
        }
        out.USD = 1;
        if (count < 20) return null;
        return { rates: out, next: 0 };
    }

    return null;
}

function cxRefresh(force) {
    if (cxLoading) return;

    var now = Date.now();

    if (!force) {
        var due = cxRates === null || now >= (cxNext || (cxStamp + 86400000));
        if (!due) return;
        if (now - cxLastTry < 1800000) return;
    }

    cxLastTry = now;
    cxLoading = true;
    cxFailed = false;
    cxRenderStatus();

    var idx = 0;

    function attempt() {
        if (idx >= CX_URLS.length) {
            cxLoading = false;
            cxFailed = true;
            cxRenderAll();
            return;
        }

        var url = CX_URLS[idx];
        idx++;

        cxGet(url, function (data) {
            var parsed = cxParse(data);
            if (!parsed) { attempt(); return; }

            cxRates = parsed.rates;
            cxStamp = Date.now();
            cxNext = parsed.next > cxStamp ? parsed.next : cxStamp + 86400000;
            cxSave();
            cxLoading = false;
            cxFailed = false;
            cxRenderAll();
        }, attempt);
    }

    attempt();
}
/* ----- Helpers ----- */
function cxName(code) {
    return CUR_NAMES.hasOwnProperty(code) ? CUR_NAMES[code] : code;
}

function cxRate(a, b) {
    if (!cxRates || !cxRates[a] || !cxRates[b]) return null;
    return cxRates[b] / cxRates[a];
	}

	function cxCommas(s) {
    return s.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function cxFormatTyped(str) {
    var parts = str.split(".");
    var ip = cxCommas(parts[0]);
    return parts.length > 1 ? ip + "." + parts[1] : ip;
}

function cxFormatResult(n) {
    if (!isFinite(n)) return "\u2014";
    if (n === 0) return "0";
    if (Math.abs(n) >= 1) {
        var parts = n.toFixed(2).split(".");
        return cxCommas(parts[0]) + "." + parts[1];
    }
    var s = String(parseFloat(n.toPrecision(4)));
    if (s.indexOf("e") !== -1) s = n.toFixed(8);
    return s;
}

function cxFormatRate(r) {
    if (r >= 1000) return cxFormatResult(r);
    if (r >= 1) return String(parseFloat(r.toFixed(4)));
    var s = String(parseFloat(r.toPrecision(4)));
    if (s.indexOf("e") !== -1) s = r.toFixed(8);
    return s;
}

function cxFit(el, txt) {
    var n = txt.length;
    var s = 36;
    if (n > 18) s = 18;
    else if (n > 14) s = 22;
    else if (n > 11) s = 27;
    else if (n > 8) s = 31;
    el.style.fontSize = s + "px";
}

function cxStampText() {
    var m = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    var d = new Date(cxStamp);
    var hh = d.getHours();
    var mm = d.getMinutes();
    return d.getDate() + " " + m[d.getMonth()] + " " + d.getFullYear() + ", " +
        (hh < 10 ? "0" : "") + hh + ":" + (mm < 10 ? "0" : "") + mm;
}

/* ----- Screen ----- */
function cxRenderStatus() {
    var el = document.getElementById("curStatus");
    var msg;

    if (cxLoading) msg = "Updating rates...";
    else if (cxRates === null) msg = "Connect to the internet once to download rates.";
    else if (cxFailed) msg = "Offline: using saved rates from " + cxStampText();
    else msg = "Rates updated: " + cxStampText();

    el.textContent = msg;
}

function cxRenderAll() {
    var st = cxState;

    document.getElementById("fromCode").textContent = st.from;
    document.getElementById("fromName").textContent = cxName(st.from);
    document.getElementById("toCode").textContent = st.to;
    document.getElementById("toName").textContent = cxName(st.to);

    var r = cxRate(st.from, st.to);
    var amt = parseFloat(st.amount);
    if (isNaN(amt)) amt = 0;

    var fromTxt, toTxt;

    if (st.active === "from") {
        fromTxt = cxFormatTyped(st.amount);
        toTxt = r === null ? "\u2014" : cxFormatResult(amt * r);
    } else {
        toTxt = cxFormatTyped(st.amount);
        fromTxt = r === null ? "\u2014" : cxFormatResult(amt / r);
    }

    var fromEl = document.getElementById("fromAmt");
    var toEl = document.getElementById("toAmt");

    fromEl.textContent = fromTxt;
    toEl.textContent = toTxt;
    cxFit(fromEl, fromTxt);
    cxFit(toEl, toTxt);

    document.getElementById("rowFrom").className = "cur-row" + (st.active === "from" ? " active" : "");
    document.getElementById("rowTo").className = "cur-row" + (st.active === "to" ? " active" : "");

    document.getElementById("curRate").textContent =
        r === null ? "" : "1 " + st.from + " = " + cxFormatRate(r) + " " + st.to;

    cxRenderStatus();
}

/* ----- Numpad ----- */
function cxKey(key) {
    var st = cxState;

    if (key === "swap") {
        var t = st.from;
        st.from = st.to;
        st.to = t;
        cxSavePair();
    } else if (key === "refresh") {
        cxRefresh(true);
        return;
    } else if (key === "ac") {
        st.amount = "0";
        st.fresh = false;
    } else if (key === "back") {
        if (st.fresh) {
            st.amount = "0";
            st.fresh = false;
        } else {
            st.amount = st.amount.length > 1 ? st.amount.slice(0, -1) : "0";
        }
    } else if (key === ".") {
        if (st.fresh) {
            st.amount = "0.";
            st.fresh = false;
        } else if (st.amount.indexOf(".") === -1) {
            st.amount += ".";
        }
    } else {
        if (st.fresh) {
            st.amount = key;
            st.fresh = false;
        } else if (st.amount === "0") {
            st.amount = key;
        } else if (st.amount.replace(".", "").length < 12) {
            st.amount += key;
        }
    }

    cxRenderAll();
}

var cxPadButtons = document.querySelectorAll("#curPad button");

for (var cb = 0; cb < cxPadButtons.length; cb++) {
    cxPadButtons[cb].onclick = function () {
        cxKey(this.getAttribute("data-k"));
    };
}

document.getElementById("fromAmt").onclick = function () {
    if (cxState.active !== "from") {
        cxState.active = "from";
        cxState.fresh = true;
        cxRenderAll();
    }
};

document.getElementById("toAmt").onclick = function () {
    if (cxState.active !== "to") {
        cxState.active = "to";
        cxState.fresh = true;
        cxRenderAll();
    }
};
/* ----- Currency picker ----- */
function cxCodes() {
    var src = cxRates ? cxRates : CUR_NAMES;
    var arr = [];
    for (var c in src) {
        if (src.hasOwnProperty(c)) arr.push(c);
    }
    arr.sort(function (x, y) {
        var px = CUR_POPULAR.indexOf(x);
        var py = CUR_POPULAR.indexOf(y);
        if (px !== -1 && py !== -1) return px - py;
        if (px !== -1) return -1;
        if (py !== -1) return 1;
        return x < y ? -1 : (x > y ? 1 : 0);
    });
    return arr;
}

function cxRenderList(q) {
    var query = q.toLowerCase();
    var codes = cxCodes();
    var shownCount = 0;

    cxList.innerHTML = "";

    for (var i = 0; i < codes.length; i++) {
        (function (code) {
            var name = cxName(code);
            var hay = (code + " " + name).toLowerCase();
            if (query && hay.indexOf(query) === -1) return;

            var row = document.createElement("div");
            row.className = "cur-item" + (code === cxState[cxPickerSide] ? " sel" : "");

            var c = document.createElement("span");
            c.className = "c";
            c.textContent = code;

            var n = document.createElement("span");
            n.className = "n";
            n.textContent = name;

            row.appendChild(c);
            row.appendChild(n);

            row.onclick = function () {
                cxState[cxPickerSide] = code;
                cxSavePair();
                cxPicker.className = "cur-picker";
                cxSearch.blur();
                cxRenderAll();
            };

            cxList.appendChild(row);
            shownCount++;
        })(codes[i]);
    }

    if (shownCount === 0) {
        var none = document.createElement("div");
        none.className = "cur-item";
        none.textContent = "No currency found";
        cxList.appendChild(none);
    }
}

function cxOpenPicker(side) {
    cxPickerSide = side;
    cxSearch.value = "";
    cxRenderList("");
    cxPicker.className = "cur-picker show";
    cxList.scrollTop = 0;
}

document.getElementById("pickFrom").onclick = function () { cxOpenPicker("from"); };
document.getElementById("pickTo").onclick = function () { cxOpenPicker("to"); };

document.getElementById("pickClose").onclick = function () {
    cxSearch.blur();
    cxPicker.className = "cur-picker";
};

cxSearch.oninput = function () { cxRenderList(this.value); };
cxSearch.onkeyup = function () { cxRenderList(this.value); };

/* ----- Open / close ----- */
document.getElementById("curToggle").onclick = function () {
    cxState.fresh = true;
    cxScreen.className = "cur-screen show";
    cxRenderAll();
    cxRefresh(false);
};

document.getElementById("curClose").onclick = function () {
    cxPicker.className = "cur-picker";
    cxScreen.className = "cur-screen";
};

/* ----- Daily auto update ----- */
window.addEventListener("online", function () {
    cxLastTry = 0;
    cxRefresh(false);
});

document.addEventListener("visibilitychange", function () {
    if (!document.hidden) cxRefresh(false);
});

setInterval(function () { cxRefresh(false); }, 3600000);

/* ---------- Shuru ---------- */
updateSciLabels();
render();
renderHistory();
cxLoad();
cxRenderAll();
cxRefresh(false);
</script>
